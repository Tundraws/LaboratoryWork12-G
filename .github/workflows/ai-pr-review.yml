name: AI PR Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate AI PR summary
        id: summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          title = os.getenv("PR_TITLE", "")
          body = os.getenv("PR_BODY", "")
          api_key = os.getenv("OPENAI_API_KEY", "")

          def changed_files() -> str:
              try:
                  output = subprocess.check_output(
                      ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except Exception:
                  output = ""
              return output or "No changed files detected in this run."

          def fallback_comment(reason: str) -> str:
              return "\n".join(
                  [
                      "## Summary",
                      "AI summary generation was attempted, but the external AI API was unavailable.",
                      "",
                      f"Fallback reason: `{reason}`",
                      "",
                      "Changed files:",
                      "```",
                      changed_files(),
                      "```",
                      "",
                      "## Risks",
                      "- Review authentication and authorization changes carefully.",
                      "- Check migrations, async database calls, and validation logic.",
                      "- Run the test suite before merging.",
                      "",
                      "## Suggested checks",
                      "- `pytest`",
                      "- `docker compose config`",
                      "- Manual check of `/docs` for API route visibility",
                  ]
              )

          prompt = "\n".join(
              [
                  "You are a senior code reviewer.",
                  "Create a concise pull request summary and list possible risks.",
                  f"Title: {title}",
                  f"Body: {body}",
                  "Output markdown with sections: Summary, Risks, Suggested checks.",
              ]
          )

          if not api_key:
              content = fallback_comment("OPENAI_API_KEY secret is not configured")
          else:
              payload = {
                  "model": "gpt-4o-mini",
                  "messages": [
                      {"role": "system", "content": "You are a precise reviewer."},
                      {"role": "user", "content": prompt},
                  ],
                  "temperature": 0.2,
              }
              req = urllib.request.Request(
                  "https://api.openai.com/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": f"Bearer {api_key}",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))
                  content = data["choices"][0]["message"]["content"]
              except urllib.error.HTTPError as exc:
                  content = fallback_comment(f"OpenAI API returned HTTP {exc.code}")
              except urllib.error.URLError as exc:
                  content = fallback_comment(f"OpenAI API request failed: {exc.reason}")

          with open("ai_comment.md", "w", encoding="utf-8") as file:
            file.write(content)
          print(content)
          PY

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ai_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
